name: build

# Elke push naar main en elke pull request: bouwen en testen op macOS (AU en VST3, universal)
# en op Windows (VST3, 64-bit), met unit tests, auval (Mac) en een hostcontrole die de
# plugin laadt zoals een DAW. Een versielabel (v1.0.0 en verder) of een handmatige start
# maakt bovendien de releasepakketten: een zip voor macOS en een zip voor Windows, elk met
# het installatiebriefje, de handleiding als PDF en de licenties. Bij een versielabel komen
# ze in een GitHub Release. De repo is openbaar, dus de minuten zijn gratis.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Gereedschap
        run: brew install ninja

      - name: Configureren (universal)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Bouwen (AU, VST3, tests, hostcontrole)
        run: |
          cmake --build build
          cmake --build build --target RoughStartHostCheck

      - name: Unit tests
        run: ./build/RoughStartTests_artefacts/Release/RoughStartTests

      - name: Architecturen
        run: |
          lipo -archs build/RoughStart_artefacts/Release/AU/RoughStart.component/Contents/MacOS/RoughStart
          lipo -archs build/RoughStart_artefacts/Release/VST3/RoughStart.vst3/Contents/MacOS/RoughStart

      - name: auval
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx RgSt TvdK | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: Hostcontrole (VST3 en AU)
        run: |
          ./build/RoughStartHostCheck_artefacts/Release/RoughStartHostCheck build/RoughStart_artefacts/Release/VST3/RoughStart.vst3
          ./build/RoughStartHostCheck_artefacts/Release/RoughStartHostCheck build/RoughStart_artefacts/Release/AU/RoughStart.component

      - name: Releasepakket macOS (zip met PDF's en licenties)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install --quiet --user markdown || python3 -m pip install --quiet --user --break-system-packages markdown
          ./scripts/package.sh

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: roughstart-macos
          path: dist/*.zip

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: roughstart-docs
          path: dist/docs/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configureren (64-bit)
        run: cmake -B build -A x64

      - name: Bouwen (VST3, tests, hostcontrole)
        run: cmake --build build --config Release --target RoughStart_VST3 RoughStartTests RoughStartHostCheck

      - name: Unit tests
        run: build/RoughStartTests_artefacts/Release/RoughStartTests.exe

      - name: Hostcontrole (VST3)
        run: build/RoughStartHostCheck_artefacts/Release/RoughStartHostCheck.exe build/RoughStart_artefacts/Release/VST3/RoughStart.vst3

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: roughstart-windows-vst3
          path: build/RoughStart_artefacts/Release/VST3/

  # Windows-zip: de VST3 met dezelfde PDF's en licenties als het Mac-pakket.
  windows-package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: roughstart-windows-vst3
          path: pkg/vst3
      - uses: actions/download-artifact@v8
        with:
          name: roughstart-docs
          path: pkg/docs
      - name: Zip
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          name="RoughStart-$version-windows"
          mkdir -p "out/$name" dist
          cp -R pkg/vst3/RoughStart.vst3 "out/$name/"
          cp pkg/docs/* "out/$name/"
          (cd out && zip -qr "../dist/$name.zip" "$name")
          unzip -l "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: roughstart-windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "roughstart-*"
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          body: |
            **macOS** (Apple Silicon and Intel, macOS 12 or later): Audio Unit and VST3. Tested in Logic Pro; other hosts should work but are untested.

            1. Download `RoughStart-…-macos.zip` and unzip it.
            2. Move `RoughStart.component` to `~/Library/Audio/Plug-Ins/Components` (Finder: Go > Go to Folder...). For VST3 hosts such as Cubase or Bitwig, also move `RoughStart.vst3` to `~/Library/Audio/Plug-Ins/VST3`.
            3. RoughStart is not signed with an Apple Developer ID, so remove the download block once in Terminal (and the same for the `.vst3` in its folder if you installed it):

            ```
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/RoughStart.component
            ```

            4. (Re)start your DAW. In Logic, RoughStart is under Audio Units > TvdK > RoughStart.

            **Windows** (64-bit): VST3. New and not yet tested in a DAW; reports are very welcome.

            1. Download `RoughStart-…-windows.zip` and extract it.
            2. Copy the `RoughStart.vst3` folder to `C:\Program Files\Common Files\VST3`.
            3. (Re)start your DAW and rescan plug-ins if needed.

            **Manual**: in the zip as PDF, and in the plug-in under **?**. What changed: see [CHANGELOG.md](https://github.com/tonvanderkolk/roughstart/blob/main/CHANGELOG.md) (Dutch).

            Free and open source under AGPL-3.0. Like RoughStart? You can [support it with a coffee](https://buymeacoffee.com/tvdk71).
