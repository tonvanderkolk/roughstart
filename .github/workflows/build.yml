name: build

# Elke push naar main en elke pull request: bouwen, unit tests en auval op macOS.
# Een versielabel (v1.0.0 en verder) of een handmatige start maakt bovendien het
# releasepakket (universal, Apple Silicon en Intel): de plugin met het installatiebriefje,
# de handleiding als PDF en de licenties. Bij een versielabel komt de zip in een GitHub Release.
# De repo is openbaar, dus de macOS-minuten zijn gratis.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Gereedschap
        run: |
          brew install ninja
          cmake --version
          ninja --version

      - name: Configureren (universal)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Bouwen
        run: cmake --build build

      - name: Unit tests
        run: ./build/RoughStartTests_artefacts/Release/RoughStartTests

      - name: Architecturen
        run: lipo -archs build/RoughStart_artefacts/Release/AU/RoughStart.component/Contents/MacOS/RoughStart

      - name: auval
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx RgSt TvdK | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: Releasepakket (zip met PDF's en licenties)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install --quiet --user markdown || python3 -m pip install --quiet --user --break-system-packages markdown
          ./scripts/package.sh

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: roughstart-macos
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: |
            **macOS** (Apple Silicon and Intel, macOS 12 or later), Audio Unit. Tested in Logic Pro; other AU hosts should work but are untested.

            1. Download the zip below and unzip it.
            2. Move `RoughStart.component` to `~/Library/Audio/Plug-Ins/Components` (Finder: Go > Go to Folder...).
            3. RoughStart is not signed with an Apple Developer ID, so remove the download block once in Terminal:

            ```
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/RoughStart.component
            ```

            4. (Re)start your DAW. In Logic, RoughStart is under Audio Units > TvdK > RoughStart.

            **Manual**: in the zip as PDF, and in the plug-in under **?**. What changed: see [CHANGELOG.md](https://github.com/tonvanderkolk/roughstart/blob/main/CHANGELOG.md) (Dutch).

            Free and open source under AGPL-3.0. Like RoughStart? You can [support it with a coffee](https://buymeacoffee.com/tvdk71).
