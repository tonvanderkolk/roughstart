name: build

# Elke push naar main en elke pull request: bouwen en testen op macOS (AU en VST3, universal)
# en op Windows (VST3, 64-bit), met unit tests, auval (Mac) en een hostcontrole die de
# plugin laadt zoals een DAW. Een versielabel (v1.0.0 en verder) of een handmatige start
# maakt bovendien de releasepakketten: een zip voor macOS en een zip voor Windows, elk met
# het installatiebriefje, de handleiding als PDF en de licenties. Bij een versielabel komen
# ze in een GitHub Release. De repo is openbaar, dus de minuten zijn gratis.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Gereedschap
        run: brew install ninja

      - name: Configureren (universal)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Bouwen (AU, VST3, tests, hostcontrole)
        run: |
          cmake --build build
          cmake --build build --target RoughStartHostCheck RoughStartAnalyzeSim

      - name: Unit tests
        run: ./build/RoughStartTests_artefacts/Release/RoughStartTests

      - name: Analyze All-simulatie (sporen die de host tijdelijk overslaat)
        run: ./build/RoughStartAnalyzeSim_artefacts/Release/RoughStartAnalyzeSim

      - name: Architecturen
        run: |
          lipo -archs build/RoughStart_artefacts/Release/AU/RoughStart.component/Contents/MacOS/RoughStart
          lipo -archs build/RoughStart_artefacts/Release/VST3/RoughStart.vst3/Contents/MacOS/RoughStart

      - name: auval
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx RgSt TvdK | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: Hostcontrole (VST3 en AU)
        run: |
          ./build/RoughStartHostCheck_artefacts/Release/RoughStartHostCheck build/RoughStart_artefacts/Release/VST3/RoughStart.vst3
          ./build/RoughStartHostCheck_artefacts/Release/RoughStartHostCheck build/RoughStart_artefacts/Release/AU/RoughStart.component

      - name: Certificaat en notarisatiesleutel klaarzetten
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "Geen certificaat: het pakket blijft ongesigneerd."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$MACOS_CERT_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m1 'Developer ID Application' | sed 's/.*"\(.*\)"/\1/')
          echo "SIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
          if [ -n "$MACOS_INSTALLER_P12" ]; then
            echo "$MACOS_INSTALLER_P12" | base64 --decode >"$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$MACOS_INSTALLER_PASSWORD" \
              -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/pkgbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
            rm "$RUNNER_TEMP/installer.p12"
            installer=$(security find-identity -v "$keychain" | grep -m1 'Developer ID Installer' | sed 's/.*"\(.*\)"/\1/')
            echo "INSTALLER_IDENTITY=$installer" >>"$GITHUB_ENV"
          fi
          if [ -n "$NOTARY_KEY_P8" ]; then
            echo "$NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >>"$GITHUB_ENV"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID" >>"$GITHUB_ENV"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER" >>"$GITHUB_ENV"
          fi

      - name: Releasepakket macOS (zip met PDF's en licenties)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install --quiet --user markdown || python3 -m pip install --quiet --user --break-system-packages markdown
          ./scripts/package.sh

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: roughstart-macos
          path: |
            dist/*.zip
            dist/*.pkg

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: roughstart-docs
          path: dist/docs/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configureren (64-bit)
        run: cmake -B build -A x64

      - name: Bouwen (VST3, tests, hostcontrole)
        run: cmake --build build --config Release --target RoughStart_VST3 RoughStartTests RoughStartHostCheck

      - name: Unit tests
        run: build/RoughStartTests_artefacts/Release/RoughStartTests.exe

      - name: Hostcontrole (VST3)
        run: build/RoughStartHostCheck_artefacts/Release/RoughStartHostCheck.exe build/RoughStart_artefacts/Release/VST3/RoughStart.vst3

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: roughstart-windows-vst3
          path: build/RoughStart_artefacts/Release/VST3/

  # Windows-zip: de VST3 met dezelfde PDF's en licenties als het Mac-pakket.
  windows-package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: roughstart-windows-vst3
          path: pkg/vst3
      - uses: actions/download-artifact@v8
        with:
          name: roughstart-docs
          path: pkg/docs
      - name: Zip
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          name="RoughStart-$version-windows"
          mkdir -p "out/$name" dist
          cp -R pkg/vst3/RoughStart.vst3 "out/$name/"
          cp pkg/docs/* "out/$name/"
          (cd out && zip -qr "../dist/$name.zip" "$name")
          unzip -l "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: roughstart-windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "roughstart-*"
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.pkg
          body: |
            **macOS** (Apple Silicon and Intel, macOS 12 or later): Audio Unit and VST3, signed and notarized by Apple. Tested in Logic Pro and Cubase Pro 14.

            Easiest: download `RoughStart-…-macos.pkg`, double-click it and follow the steps. It installs the Audio Unit and VST3 in `/Library/Audio/Plug-Ins` and asks for your Mac password.

            Or by hand:

            1. Download `RoughStart-…-macos.zip` and unzip it.
            2. Move `RoughStart.component` to `~/Library/Audio/Plug-Ins/Components` (Finder: Go > Go to Folder...). For VST3 hosts such as Cubase or Bitwig, also move `RoughStart.vst3` to `~/Library/Audio/Plug-Ins/VST3`.
            3. (Re)start your DAW. In Logic, RoughStart is under Audio Units > TvdK > RoughStart. In Cubase, if an older blocked version is in Studio > VST Plug-in Manager, select it and click Reactivate.

            **Windows** (64-bit): VST3. New and not yet tested in a DAW; reports are very welcome.

            1. Download `RoughStart-…-windows.zip` and extract it.
            2. Copy the `RoughStart.vst3` folder to `C:\Program Files\Common Files\VST3`.
            3. (Re)start your DAW and rescan plug-ins if needed.

            **Manual**: in the zip as PDF, and in the plug-in under **?**. What changed: see [CHANGELOG.md](https://github.com/tonvanderkolk/roughstart/blob/main/CHANGELOG.md) (Dutch).

            Free and open source under AGPL-3.0. Like RoughStart? You can [support it with a coffee](https://buymeacoffee.com/tvdk71).
